[workspace]
resolver = "3"
members = ["crates/ditox-rpc", "crates/ditoxd", "crates/ditox"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/grok-insider/ditox"
publish = false

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
