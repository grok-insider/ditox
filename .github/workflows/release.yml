name: Release

# A tag `v<version>` builds the two programs for Linux and for Windows and
# publishes them as a GitHub release, with their checksums.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: x86_64-linux
    # The oldest runner: the programs then run on any glibc from 2.35 on.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: The tag is the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --workspace --locked

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Third-party licences
        run: cargo about generate --locked about.hbs -o THIRD-PARTY-LICENSES.html

      - name: Package
        run: |
          name="ditox-$VERSION-x86_64-linux"
          mkdir -p "dist/$name"
          install -m755 target/release/ditox target/release/ditoxd "dist/$name/"
          install -m644 crates/ditox/ditox.desktop packaging/ditox.service LICENSE README.md THIRD-PARTY-LICENSES.html "dist/$name/"
          "dist/$name/ditoxd" --version
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: x86_64-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag is the version in Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --workspace --locked

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Third-party licences
        run: cargo about generate --locked about.hbs -o THIRD-PARTY-LICENSES.html

      - name: Package
        shell: bash
        run: |
          name="ditox-$VERSION-x86_64-windows"
          mkdir -p "dist/$name"
          cp target/release/ditox.exe target/release/ditoxd.exe LICENSE README.md THIRD-PARTY-LICENSES.html "dist/$name/"
          "dist/$name/ditoxd.exe" --version
          cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: publish
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum ditox-* > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Ditox ${GITHUB_REF_NAME#v}" \
            --notes "Ditox for Linux (x86_64, glibc 2.35 or later) and for Windows 10 and 11 (x86_64). How to install each is in the [README](https://github.com/${GITHUB_REPOSITORY}#install); \`SHA256SUMS\` has the checksum of every download." \
            --generate-notes
