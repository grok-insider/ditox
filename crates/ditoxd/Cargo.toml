[package]
name = "ditoxd"
description = "Ditox clipboard daemon"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "ditoxd"
path = "src/lib.rs"

[[bin]]
name = "ditoxd"
path = "src/main.rs"

[dependencies]
base64.workspace = true
ditox-rpc = { path = "../ditox-rpc" }
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Bitmaps on the Windows clipboard become the PNG the daemon keeps, and a
# stored picture the bitmap other programs paste.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
