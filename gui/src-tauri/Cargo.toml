[package]
name = "ditox-gui"
version = "0.1.0"
edition = "2021"
description = "Ditox clipboard window"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
