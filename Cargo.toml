[workspace]
resolver = "3"
members = ["crates/ditox-rpc", "crates/ditoxd", "crates/ditox"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
